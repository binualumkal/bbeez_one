name: bbeez_one

description: "BBeez One Secure Record Management App"

publish_to: 'none'

version: 1.0.6+10

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  intl: ^0.20.2
  path: ^1.9.0
  crypto: ^3.0.5

  # Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # Backup / Restore
  encrypt: ^5.0.3
  file_picker: ^11.0.2
  share_plus: ^12.0.2

  provider: ^6.1.2

  # Biometric
  local_auth: ^3.0.1

  permission_handler: ^12.0.1
  shared_preferences: ^2.5.3

  package_info_plus: ^9.0.0
  http: ^1.2.1
  url_launcher: ^6.3.0
  new_version_plus: ^1.0.1

  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.0
  flutter_secure_storage: ^9.2.2
  cryptography: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

  build_runner: ^2.4.13
  hive_generator: ^2.0.1

dependency_overrides:

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/bbeez_logo.png
    - assets/icon/icon.png
